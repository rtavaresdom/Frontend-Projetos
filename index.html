
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <div class="logo">🎓</div>

        <h1>Sistema de Notas</h1>

        <form id="formulario">

            <label for="nome">Nome do aluno:</label>
            <input type="text" id="nome"
                   placeholder="Digite o nome do aluno">

            <label for="nota1">Primeira nota:</label>
            <input type="number" id="nota1"
                   placeholder="Nota de 0 a 10"
                   min="0" max="10" step="any">

            <label for="nota2">Segunda nota:</label>
            <input type="number" id="nota2"
                   placeholder="Nota de 0 a 10"
                   min="0" max="10" step="any">

            <div class="botoes">

                <button type="button" class="media"
                        onclick="calcularMedia()">
                    MÉDIA
                </button>

                <button type="button" class="situacao"
                        onclick="mostrarSituacao()">
                    SITUAÇÃO
                </button>

                <button type="button" class="limpar"
                        onclick="limparCampos()">
                    LIMPAR
                </button>

            </div>

        </form>

        <div id="resultado">
            Preencha os dados e clique em MÉDIA.
        </div>

        <div class="rodape">
            <p id="dataHora"></p>
            <a href="sobre.html">Conheça esta página</a>
        </div>

    </div>

    <a href="page1.html">Próxima Página</a>

    <script src="script.js"></script>

</body>
</html>
